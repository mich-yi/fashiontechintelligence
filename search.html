<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(9% 0.002 90);}
  a{color:inherit;text-decoration:none;}
  a:hover{color:oklch(62% 0.01 90);}
  input::placeholder{color:oklch(45% 0.01 90);}
  @font-face{font-family:'Voire Display ExtraLight';src:url('uploads/voire-display-extralight/Voire Display ExtraLight.ttf');font-weight:200;}
</style>
</helmet>

<div style="background:oklch(9% 0.002 90); color:oklch(96% 0.004 90); font-family:'Manrope',sans-serif; min-height:100vh;">

  <div style="display:flex; justify-content:space-between; align-items:center; padding:26px 56px; border-bottom:1px solid oklch(30% 0.01 90); flex-wrap:wrap; gap:16px;">
    <a href="index.html" style="font-family:'Voire Display ExtraLight',sans-serif; font-size:24px; letter-spacing:0.01em;">Fashion Tech Intelligence</a>
    <div style="display:flex; align-items:center; gap:36px; flex-wrap:wrap;">
      <nav style="display:flex; gap:28px; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:oklch(80% 0.01 90);">
        <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}"><a href="archive.html">Categories</a><a href="search.html">Search</a><a href="about.html">About</a></sc-if>
        <sc-if value="{{ isKo }}"><a href="archive.html">카테고리</a><a href="search.html">검색</a><a href="about.html">소개</a></sc-if>
      </nav>
      <div style="font-size:12px; letter-spacing:0.08em;">
        <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}"><span onclick="{{ setEn }}" style="cursor:pointer; border-bottom:1px solid oklch(62% 0.01 90);">EN</span><span style="color:oklch(50% 0.01 90);"> / </span><span onclick="{{ setKo }}" style="cursor:pointer; color:oklch(60% 0.01 90);">KO</span></sc-if>
        <sc-if value="{{ isKo }}"><span onclick="{{ setEn }}" style="cursor:pointer; color:oklch(60% 0.01 90);">EN</span><span style="color:oklch(50% 0.01 90);"> / </span><span onclick="{{ setKo }}" style="cursor:pointer; border-bottom:1px solid oklch(62% 0.01 90);">KO</span></sc-if>
      </div>
    </div>
  </div>

  <div style="max-width:900px; margin:0 auto; padding:80px 40px 120px;">
    <div style="font-family:'Bodoni Moda',serif; font-size:40px; margin-bottom:32px;">
      <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}">Search</sc-if>
      <sc-if value="{{ isKo }}">검색</sc-if>
    </div>

    <div style="border-bottom:1px solid oklch(96% 0.004 90); padding-bottom:16px; margin-bottom:56px;">
      <input value="{{ query }}" oninput="{{ onQuery }}" type="text" placeholder="Search articles, categories, authors…" style="width: 100%; background: transparent; border: none; outline: none; font-family: 'Bodoni Moda',serif; font-style: italic; font-size: 20px; color: oklch(96% 0.004 90)">
    </div>

    <div style="font-size:11px; letter-spacing:0.14em; color:oklch(62% 0.01 90); margin-bottom:24px;">
      <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}">RESULTS</sc-if>
      <sc-if value="{{ isKo }}">검색 결과</sc-if>
    </div>

    <div style="display:flex; flex-direction:column;">
      <sc-for list="{{ results }}" as="item" hint-placeholder-count="2">
        <a href="{{ item.href }}" style="display:flex; flex-direction:column; gap:6px; padding:22px 0; border-bottom:1px solid oklch(24% 0.005 90);">
          <span style="font-size:11px; letter-spacing:0.08em; color:oklch(62% 0.01 90);">{{ item.cat }}</span>
          <span style="font-family:'Bodoni Moda',serif; font-size:23px;">{{ item.title }}</span>
        </a>
      </sc-for>
      <sc-if value="{{ noResults }}">
        <div style="padding:22px 0; color:oklch(55% 0.01 90); font-size:14px;">
          <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}">No stories match your search.</sc-if>
          <sc-if value="{{ isKo }}">검색 결과가 없습니다.</sc-if>
        </div>
      </sc-if>
    </div>

    <div style="margin-top:64px; padding-top:32px; border-top:1px solid oklch(24% 0.005 90);">
      <a href="index.html" style="font-size:13px; letter-spacing:0.08em; color:oklch(70% 0.01 90);">← <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}">Back to Fashion Tech Intelligence</sc-if><sc-if value="{{ isKo }}">홈으로 돌아가기</sc-if></a>
    </div>
  </div>
</div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#111"></rect><text x="50" y="58" font-size="34" text-anchor="middle" fill="#c9a86a" font-family="'Bodoni Moda',serif">FTI</text></svg>
</template>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en', query: '' };
  ALL = [
    { title: "In the AI Era, Is Your Brand Part of the Answer?", cat: "AI & FUTURE", href: "article-ai-era.dc.html" },
    { title: "Voice-First: How Speech AI and STT Are Transforming Fashion Design", cat: "BIG DATA & ML", href: "article-voice-first.dc.html" },
    { title: "Digital Product Passports and LVMH's Aura Blockchain Consortium", cat: "SUSTAINABILITY & REGULATION", href: "article-dpp-lvmh.dc.html" },
    { title: "Adidas: Sustainability Strategy and the Road to Digital Product Passports", cat: "SUSTAINABILITY & REGULATION", href: "article-adidas-dpp.dc.html" },
    { title: "Digital Product Passports (DPP) and Sustainability Solutions", cat: "SUSTAINABILITY & REGULATION", href: "article-dpp-solutions.dc.html" },
    { title: "TikTok's Discovery Commerce and the Power of Invisible AI Infrastructure", cat: "CLOUD SERVICE", href: "article-tiktok-ai.dc.html" },
    { title: "Can AI-Powered D2C Become K-Fashion's Breakthrough to the Global Market?", cat: "LUXURY & BRAND STRATEGY", href: "article-kfashion-d2c.dc.html" },
    { title: "The Power of Data and AI Behind Andar's Turnaround Story", cat: "BIG DATA & ML", href: "article-andar-data.dc.html" }
  ];
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const results = q ? this.ALL.filter(a => a.title.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)) : this.ALL;
    return {
      isEn: this.state.lang === 'en',
      isKo: this.state.lang === 'ko',
      setEn: () => this.setState({ lang: 'en' }),
      setKo: () => this.setState({ lang: 'ko' }),
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      results,
      noResults: results.length === 0
    };
  }
}
</script>
</body>
</html>
